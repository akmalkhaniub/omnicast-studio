version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: omnicast-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: omnicast
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: omnicast-memgraph
    restart: unless-stopped
    ports:
      - "7687:7687" # Bolt protocol
      - "3000:3000" # Memgraph Lab UI
    environment:
      MEMGRAPH: "--log-level=WARNING"
    volumes:
      - memgraph_data:/var/lib/memgraph

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: omnicast-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://mongodb:27017/omnicast
      MEMGRAPH_HOST: memgraph
      USE_EMBEDDED_GRAPH: "false"
      PORT: "8000"
      HOST: "0.0.0.0"
    volumes:
      - ./data:/app/data

volumes:
  mongodb_data:
  memgraph_data:
