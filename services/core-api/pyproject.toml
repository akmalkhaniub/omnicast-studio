[project]
name = "omnicast-core-api"
version = "0.1.0"
description = "OmniCast Studio: Multimodal Graph RAG, Dual-Host Podcast & Real-Time Voice Gateway"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "strawberry-graphql[fastapi]>=0.250.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "motor>=3.6.0",
    "beanie>=1.27.0",
    "google-genai>=0.1.1",
    "kuzu>=0.8.0",
    "neo4j>=5.26.0",
    "langfuse>=2.55.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "numpy>=2.1.0",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "feedgen>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "deepeval>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnicast"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36",
]
